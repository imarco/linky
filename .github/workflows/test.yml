name: Linky regression
on:
  push:
    branches: [main, feature/agent-reach-platforms]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.2.0 feedparser==6.0.14
      - run: python -m pytest -q
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      - run: python -m compileall -q scripts bin
      - run: python bin/linky-get --help
      - name: Live public resource smoke
        run: python tests/live_acquisition_smoke.py
